# Blueprint do Render: New + > Blueprint > selecione este repositório
services:
  - type: web
    name: fernandes-textil
    runtime: docker
    plan: starter            # disco persistente exige plano pago
    healthCheckPath: /saude
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_SENHA
        sync: false          # o Render pede o valor na criação
    disk:
      name: dados
      mountPath: /data
      sizeGB: 1
