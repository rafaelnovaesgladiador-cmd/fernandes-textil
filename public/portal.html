<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a472a">
  <meta name="robots" content="noindex, nofollow">
  <title>Portal do Cliente — Fernandes Têxtil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/portal.css">
</head>
<body>
  <header class="topo">
    <button class="voltar" id="btnVoltar" data-acao="voltar" aria-label="Voltar">‹</button>
    <div class="marca">
      <div class="empresa" id="topoSub">Fernandes Têxtil</div>
      <div class="titulo" id="topoTitulo">Portal do Cliente</div>
    </div>
    <span class="aovivo" id="aovivo"><i></i><span>Conectando</span></span>
    <button class="icone-btn oculto" id="btnConfig" data-acao="config" aria-label="Configurações do cliente">⚙</button>
  </header>

  <main class="pagina" id="conteudo">
    <div class="carregando"><div class="spinner"></div>Carregando...</div>
  </main>

  <button class="fab oculto" id="fab"></button>

  <script src="/portal-comum.js"></script>
  <script src="/portal-gestao.js"></script>
</body>
</html>
