<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="robots" content="noindex, nofollow">
  <title>Entrar — Fernandes Têxtil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/estilo.css">
</head>
<body>
  <main class="tela-login">
    <form class="cartao-login" id="formLogin" autocomplete="on">
      <span class="logo">F</span>
      <h1>Fernandes Têxtil</h1>
      <p class="sub">Entre para controlar a operação.</p>
      <div class="grupo-login">
        <input id="username" name="username" placeholder="Usuário" autocomplete="username" autocapitalize="none" required>
        <input id="senha" name="senha" type="password" placeholder="Senha" autocomplete="current-password" required>
      </div>
      <button class="btn" type="submit" id="btnLogin">Entrar</button>
      <p class="erro" id="erroLogin" role="alert"></p>
    </form>

    <!-- Primeiro acesso com a senha de fábrica: troca obrigatória -->
    <form class="cartao-login oculto" id="formTroca">
      <span class="logo">F</span>
      <h1>Crie sua senha</h1>
      <p class="sub">Você entrou com a senha de fábrica. Defina uma senha nova para continuar.</p>
      <div class="grupo-login">
        <input id="novaSenha" type="password" placeholder="Nova senha (mínimo 8 caracteres)" autocomplete="new-password" required>
        <input id="novaSenha2" type="password" placeholder="Repita a nova senha" autocomplete="new-password" required>
      </div>
      <button class="btn" type="submit" id="btnTroca">Salvar e entrar</button>
      <p class="erro" id="erroTroca" role="alert"></p>
    </form>
  </main>

  <script>
    // Destino após o login (apenas caminhos internos, ex.: ?voltar=/#pedidos)
    const voltar = new URLSearchParams(location.search).get('voltar') || '';
    const DESTINO = /^\/[a-zA-Z0-9\-_/.#]*$/.test(voltar) && !voltar.startsWith('//') ? voltar : '/';
    let tokenTemporario = null;

    const guardar = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* sem armazenamento */ } };
    const lerToken = () => { try { return localStorage.getItem('ft_token'); } catch (e) { return null; } };

    // Já está logado? Vai direto.
    const existente = lerToken();
    if (existente) {
      fetch('/api/auth/me', { headers: { Authorization: 'Bearer ' + existente } })
        .then(r => { if (r.ok) location.replace(DESTINO); })
        .catch(() => {});
    }

    async function enviar(url, corpo, token) {
      const headers = { 'Content-Type': 'application/json' };
      if (token) headers.Authorization = 'Bearer ' + token;
      const r = await fetch(url, { method: 'POST', headers, body: JSON.stringify(corpo) });
      const dados = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(dados.error || 'Não foi possível entrar');
      return dados;
    }

    document.getElementById('formLogin').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('btnLogin');
      const erro = document.getElementById('erroLogin');
      erro.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Entrando…';
      try {
        const dados = await enviar('/api/auth/login', { username: document.getElementById('username').value.trim(), senha: document.getElementById('senha').value });
        if (dados.usuario && dados.usuario.trocar_senha) {
          tokenTemporario = dados.token;
          document.getElementById('formLogin').classList.add('oculto');
          document.getElementById('formTroca').classList.remove('oculto');
          document.getElementById('novaSenha').focus();
        } else {
          guardar('ft_token', dados.token);
          guardar('ft_usuario', JSON.stringify(dados.usuario));
          location.replace(DESTINO);
        }
      } catch (err) {
        erro.textContent = err.message === 'Failed to fetch' ? 'Sem conexão com o servidor' : err.message;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Entrar';
      }
    });

    document.getElementById('formTroca').addEventListener('submit', async e => {
      e.preventDefault();
      const nova = document.getElementById('novaSenha').value;
      const erro = document.getElementById('erroTroca');
      erro.textContent = '';
      if (nova.length < 8) { erro.textContent = 'A nova senha precisa ter pelo menos 8 caracteres'; return; }
      if (nova !== document.getElementById('novaSenha2').value) { erro.textContent = 'As duas senhas não são iguais'; return; }
      const btn = document.getElementById('btnTroca');
      btn.disabled = true;
      btn.textContent = 'Salvando…';
      try {
        const dados = await enviar('/api/auth/trocar-senha', { nova_senha: nova }, tokenTemporario);
        guardar('ft_token', dados.token);
        guardar('ft_usuario', JSON.stringify(dados.usuario));
        location.replace(DESTINO);
      } catch (err) {
        erro.textContent = err.message;
        btn.disabled = false;
        btn.textContent = 'Salvar e entrar';
      }
    });
  </script>
</body>
</html>
