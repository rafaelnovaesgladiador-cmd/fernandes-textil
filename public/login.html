<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fernandes Têxtil — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f1923 0%, #1a2535 40%, #1a472a 100%);
      padding: 20px;
    }
    .login-card {
      background: #1a2535;
      border-radius: 18px;
      padding: 48px 40px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      border: 1px solid rgba(64,192,116,0.15);
      animation: slideUp 0.5s ease;
    }
    .login-logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .login-logo .emoji {
      font-size: 3.5rem;
      display: block;
      animation: float 3s ease-in-out infinite;
    }
    .login-logo h1 {
      margin: 10px 0 4px;
      font-size: 1.5rem;
      color: #e8eaf0;
      font-weight: 700;
    }
    .login-logo p {
      color: #8a9bb0;
      font-size: 0.9rem;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      color: #8a9bb0;
      font-size: 0.85rem;
      margin-bottom: 8px;
      font-weight: 500;
    }
    .form-group input {
      width: 100%;
      padding: 13px 16px;
      background: #0f1923;
      border: 1.5px solid rgba(138,155,176,0.2);
      border-radius: 10px;
      color: #e8eaf0;
      font-size: 1rem;
      transition: border-color 0.2s, box-shadow 0.2s;
      box-sizing: border-box;
    }
    .form-group input:focus {
      outline: none;
      border-color: #40c074;
      box-shadow: 0 0 0 3px rgba(64,192,116,0.1);
    }
    .btn-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #40c074, #2ea05f);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.3px;
    }
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(64,192,116,0.3);
    }
    .btn-login:active { transform: translateY(0); }
    .login-error {
      background: rgba(220,53,69,0.15);
      border: 1px solid rgba(220,53,69,0.3);
      color: #ff6b7a;
      border-radius: 8px;
      padding: 12px 16px;
      margin-top: 16px;
      font-size: 0.88rem;
      text-align: center;
      display: none;
    }
    .btn-login.loading {
      opacity: 0.7;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo">
      <span class="emoji">🧵</span>
      <h1>Fernandes Têxtil</h1>
      <p>Sistema de Gestão</p>
    </div>
    <div class="form-group">
      <label>Usuário</label>
      <input type="text" id="username" placeholder="Digite seu usuário" autofocus autocomplete="username">
    </div>
    <div class="form-group">
      <label>Senha</label>
      <input type="password" id="senha" placeholder="Digite sua senha" autocomplete="current-password">
    </div>
    <button class="btn-login" id="btnLogin" onclick="fazerLogin()">Entrar</button>
    <div class="login-error" id="loginError"></div>
  </div>

  <script>
    // Se já tem token, redirecionar
    const token = localStorage.getItem('ft_token');
    if (token) {
      fetch('/api/auth/me', { headers: { Authorization: 'Bearer ' + token } })
        .then(r => r.ok ? window.location.href = 'index.html' : null)
        .catch(() => {});
    }

    document.getElementById('senha').addEventListener('keypress', e => {
      if (e.key === 'Enter') fazerLogin();
    });
    document.getElementById('username').addEventListener('keypress', e => {
      if (e.key === 'Enter') document.getElementById('senha').focus();
    });

    async function fazerLogin() {
      const username = document.getElementById('username').value.trim();
      const senha = document.getElementById('senha').value;
      const btn = document.getElementById('btnLogin');
      const err = document.getElementById('loginError');
      err.style.display = 'none';
      if (!username || !senha) {
        err.textContent = 'Preencha usuário e senha';
        err.style.display = 'block';
        return;
      }
      btn.classList.add('loading');
      btn.textContent = 'Entrando...';
      try {
        const resp = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, senha })
        });
        const data = await resp.json();
        if (resp.ok) {
          localStorage.setItem('ft_token', data.token);
          localStorage.setItem('ft_usuario', JSON.stringify(data.usuario));
          window.location.href = 'index.html';
        } else {
          err.textContent = data.error || 'Erro ao fazer login';
          err.style.display = 'block';
          btn.classList.remove('loading');
          btn.textContent = 'Entrar';
        }
      } catch (e) {
        err.textContent = 'Erro de conexão com o servidor';
        err.style.display = 'block';
        btn.classList.remove('loading');
        btn.textContent = 'Entrar';
      }
    }
  </script>
</body>
</html>
